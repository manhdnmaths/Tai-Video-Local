name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q Tai-Video-Local-Source-v2.0.0-alpha.6.zip -d source

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        working-directory: source/Tai-Video-Local-2.0.0-alpha.6
        run: |
          chmod +x gradlew
          ./gradlew assembleGenericDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tai-Video-Local-v2.0.0-alpha.6
          path: source/Tai-Video-Local-2.0.0-alpha.6/app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
          retention-days: 30
